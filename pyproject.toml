[project]
name = "redaktor"
version = "0.1.0"
description = "Anonimizator dokumentow PDF/DOCX - wykrywa i zamazuje dane osobowe (RODO)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pypdf>=5.0",
    "python-docx>=1.1",
]

[project.scripts]
redaktor = "redaktor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/redaktor"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
